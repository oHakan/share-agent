name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy to Frontend
        uses: actions/checkout@v4
        with:
          repository: oHakan/share-dashboard
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}
          path: frontend

      - name: Copy binaries to Frontend
        run: |
          mkdir -p frontend/public/downloads
          # GoReleaser creates archives in dist/ root
          cp dist/*.zip frontend/public/downloads/ 2>/dev/null || true
          cp dist/*.tar.gz frontend/public/downloads/ 2>/dev/null || true
          cp dist/checksums.txt frontend/public/downloads/ 2>/dev/null || true
 
      - name: Update Agent Version in ConnectNodeCard
        working-directory: frontend
        run: |
         VERSION=${{ github.ref_name }}
         VERSION=${VERSION#v}  # v0.2.4 → 0.2.4
         sed -i "s/const AGENT_VERSION = '[^']*'/const AGENT_VERSION = '$VERSION'/" components/ConnectNodeCard.tsx
         git add components/ConnectNodeCard.tsx
       
      - name: Push to Frontend
        working-directory: frontend
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/downloads/
          git commit -m "chore: update agent binaries to ${{ github.ref_name }}" || exit 0
          git push
